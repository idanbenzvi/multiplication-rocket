# Publishes the web version to GitHub Pages on every push to master:
#   https://idanbenzvi.github.io/multiplication-rocket/
# and, when a "preview" branch exists, its test build alongside it:
#   https://idanbenzvi.github.io/multiplication-rocket/preview/
# (a push to preview re-runs this through preview.yml on that branch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the preview branch into /preview/
        run: |
          if git ls-remote --exit-code --heads origin preview; then
            git fetch --depth=1 origin preview
            git worktree add ../preview FETCH_HEAD
            cd ../preview
            npm ci
            VITE_PREVIEW=1 npm run build
            cp -r dist "$GITHUB_WORKSPACE/dist/preview"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
