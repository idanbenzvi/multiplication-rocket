# Publishes the web version to GitHub Pages on every push to master:
#   https://idanbenzvi.github.io/multiplication-rocket/
# and each preview branch that exists, as a test build in a folder of its name:
#   https://idanbenzvi.github.io/multiplication-rocket/preview/
#   https://idanbenzvi.github.io/multiplication-rocket/preview_addition/
# (a push to a preview branch re-runs this through preview.yml on that branch).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the preview branches into /preview/ and /preview_addition/
        # VITE_PREVIEW_NAME keeps each preview's saved pilots apart (older
        # branches ignore it and use the plain "preview:" namespace).
        run: |
          for branch in preview preview_addition; do
            if git ls-remote --exit-code --heads origin "$branch"; then
              git fetch --depth=1 origin "$branch"
              git worktree add "../$branch" FETCH_HEAD
              (cd "../$branch" && npm ci && VITE_PREVIEW=1 VITE_PREVIEW_NAME="$branch" npm run build)
              cp -r "../$branch/dist" "$GITHUB_WORKSPACE/dist/$branch"
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
